# Gitleaks configuration
# https://github.com/gitleaks/gitleaks

title = "gitleaks config"

[extend]
# Use the default gitleaks rules as a base
useDefault = true

[allowlist]
# Paths that are safe to ignore (test fixtures, docs with placeholder values, etc.)
paths = [
    '''node_modules''',
    '''dist''',
    '''coverage''',
    '''\.bin''',
    '''package-lock\.json''',
    # NOTE: '^logs/' used to be allowlisted here. A local `gitleaks dir` run drowned
    # in ~105 findings from logs/app-*.log, because Logger wrote live sessions to
    # disk — RequestHandler logged its whole request config, and config.auth IS the
    # session. That is fixed at the source (see src/util/redact.ts, wired into
    # Logger as a format), so the suppression is no longer needed and the logs are
    # back under the scanner where they belong.
]

# Synthetic placeholder values used as jest fixtures. Scoped to the exact
# literal rather than allowlisting test/ wholesale, so a genuine secret
# committed to a test file is still caught.
regexes = [
    '''ABCDEF1234567890ABCDEF1234567890''',
]
